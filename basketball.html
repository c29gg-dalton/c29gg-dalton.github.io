<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		#backButton {

        position: fixed;
        top: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: red;
        border-radius: 50%;
        color: white;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
		justify-content: center;
		align-items: center;
		display: flex;
      }

      #backButton:hover {
        background-color: darkred;
      }
		#bball{
			height: 150px;
			width: 150px;
			background-image: url("basketball.png");;
			background-repeat: no-repeat;
			background-size: cover;
			position: absolute;
		}
		#lebron{
      		width: 50px;
      		height: 50px;
      		border: 1px solid black;
      		font-size: 40px;
   	    }

	</style>
</head>
<body>
		<a id="backButton" href="projects.html">Back</a>
<div id="gif"></div>


<div id="bball"></div>

<center>
<div>you level of lebron is...</div>
	<div id="lebron"></div></center>
<script type="text/javascript">
	let x = 0
	let y = 0
	let bron = 0
	document.addEventListener("mousemove", function(event){
		bball.style.left=event.clientX + "px"
		bball.style.top=event.clientY + "px"
	})

	function spin (){
				x+=y
		bball.style.transform="rotate(" + x + "deg)"
		console.log(x)
		console.log(y)


	}


	document.addEventListener("mousedown", function(event){
		y=1
		setInterval(spin, 100)
		bron++
		console.log(x)
		console.log(y)
		lebron.innerText=bron


	})

		document.addEventListener("mouseup", function(event){
		y=0
		x=0
		console.log(x)
		console.log(y)
		if (bron % 10 === 0) {
			alert("get off the game")
		}
	})
	gif.style.left=("0px")
	document.addEventListener("keypress", function(){
		console.log("hi")
		gif.style.left = parseInt(gif.style.left) +5 +"px"
		if (gif.style.left<=("1000px")) {
			gif.style.left=("0px")
		}
		
	})
</script>
</body>
</html>
