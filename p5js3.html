<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
 <script>
 	function setup() {
 	  createCanvas(windowWidth, windowHeight);
 	  rectMode(CENTER)
 	  angleMode(DEGREES);
 	}
x=50
y=50
 	function draw() {
 		for (i = 0; i < 100; i++){
 			face(0,0,255)
 			x+=100
 		}
 	function face (r,g,b){
 		fill(r,g,b)
 		ellipse(50,50,50,50)
 	}
 </script>
</body>
</html>
