<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
 <script>
 	function setup() {
 	  createCanvas(windowWidth, windowHeight);
 	  rectMode(CENTER)
 	  angleMode(DEGREES);
 	}
x=50
y=1
z=50
 	function draw() {
 		if(x==50){
 			y=1
 		}
 		if(x==0){
 			y=2
 		}
 		if(y==1){
		x+=-1
		z+=0.5		
 		}

 		if(y==2){
 		x+=+1
 		z+=-0.5
 		}
 	  background(0,0,255);
 	  stroke(0)
 	  
 	  fill(255)
 	  strokeWeight(5)
 	  ellipse(windowWidth/2, windowHeight/2,300,300)
 	  fill(255,0,0)
 	  strokeWeight(x/5)
 	  ellipse(windowWidth/2-50, windowHeight/2-50,50,x)
 	  strokeWeight(5)
 	  ellipse(windowWidth/2+50, windowHeight/2-50,50,50)
      // smile
 	  fill(0,255,0)
	arc(windowWidth/2, windowHeight/2+50, 180, 90, 0, 180);
fill(255,255,0)
arc(windowWidth/2, windowHeight/2, 80, 80,  70, 110);
 fill(255)
noStroke()
	arc(windowWidth/2, windowHeight/2+30, 180, 90, 0, 180);

	noFill()
	stroke('brown')
	arc(windowWidth/2+50, windowHeight/2-20-z, 50, 50, 200+(z/2), -20-(z/3));
	arc(windowWidth/2-50, windowHeight/2-70, 50, 50, 200+(50.5/3), -20-(50.5/3));

 	}

 </script>
</body>
</html>
