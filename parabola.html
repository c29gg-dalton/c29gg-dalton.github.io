<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
<script>


function setup() {
  createCanvas(400, 400);
  rectMode(CENTER)
  textAlign(CENTER)
}
x=-200
d=50
s=0
m=1
function draw() {
  background(0)
    
  translate(width / 2, height / 2)
  let y = x * x / 200
  fill('yellow')
  circle(x, y, d)
  x+=m
  if(s==10){
    d=grd()
   s=0
  }else{
    s++
  }
  if (x > 200) {
    m=-1
  }
  if (x < -200) {
    m=1
  }
}
function grd(){
  rd=random(30,50)
  return rd
}
</script>
</body>
</html>
