<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>
    #container {
      position: relative;
      width: 500px;
      height: 500px;
    }

    #hanukiah {
      width: 100%;
      height: 100%;
      background-image: url(menorah.png);
      background-size: contain;
      background-repeat: no-repeat;
    }

    .light {
      position: absolute;
      width: 12px;
      height: 20px;
      background: orange;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
    }

#shamash {
  top: 48px;
  left: 175px;  
  height: 28px;
}
#one   { top: 76px; left: 45px; }
#two   { top: 76px; left: 80px; }
#three { top: 76px; left: 115px; }
#four  { top: 76px; left: 150px; }
#five  { top: 76px; left: 210px; }
#six   { top: 76px; left: 245px; }
#seven { top: 76px; left: 280px; }
#eight { top: 76px; left: 315px; }



  </style>
</head>

<body>
<center>
  <div id="container">
    <div id="hanukiah"></div>
    <div class="light" id="shamash"></div>
    <div class="light" id="one"></div>
    <div class="light" id="two"></div>
    <div class="light" id="three"></div>
    <div class="light" id="four"></div>
    <div class="light" id="five"></div>
    <div class="light" id="six"></div>
    <div class="light" id="seven"></div>
    <div class="light" id="eight"></div>

  </div>
</center>

<script>
  const lights = document.querySelectorAll('.light');
  let current = 0;

  document.getElementById('container').addEventListener('click', () => {
    if (current < lights.length) {
      lights[current].style.opacity = 1;
      current++;
    }
  });
</script>
</body>
</html>
