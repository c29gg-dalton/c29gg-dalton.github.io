<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    #train{
      margin-top: 10px;
      display: flex;
      gap: 12px;
    }
    .cart{
      border: 1px solid black;
      width: 100px;
      height: 80px;
      text-align: center;
      position: relative;
    }
    .cart:before {
      content: "";
      width: 30px;
      height: 30px;
      left: 0px;
      border: 1px solid black;
      display: block;
      border-radius: 50%;
      position: absolute;
      bottom: -15px;
      background-color: white;
    }
    .cart:after {
      background-color: white;
      content: "";
      width: 30px;
      height: 30px;
      border: 1px solid black;
      display: block;
      border-radius: 50%;
      bottom: -15px;
      position: absolute;
      right: 0px;
    }
  </style>
</head>
<body>
  <input type="text" id="person">
  <input type="color" id="cp">
  <button id="add-person">add person</button>
  <button id="pop-person">get rid of person</button>

  <div id="train"></div>

<script>
  let people = []
  let apb = document.getElementById("add-person")
  let c = document.createElement("div")
  let cp = document.getElementById("cp")
  apb.addEventListener("click",function(){
    let personInput = document.getElementById("person")
    people.push({
      name: personInput.value,
      favcolor: cp.value
  })

    makeTrain()
    console.log(people)
    personInput.value = ""
    
  })
  let ppb = document.getElementById("pop-person")
    ppb.addEventListener("click",function(){
    let personInput = document.getElementById("person")
    people.pop()
    console.log(people)
        personInput.value = ""
    makeTrain()
  })
function makeTrain(){
  train.innerHTML = ""
 for (let i = 0; i < people.length; i++) {
  let c = document.createElement("div")
   c.classList.add("cart")
   c.textContent= people[i].name
   c.style.backgroundColor = people[i].favcolor
   train.appendChild(c)


  } 

}

makeTrain()

    
</script>
</body>
</html>
