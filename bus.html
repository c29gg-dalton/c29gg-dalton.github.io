<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    #train{
      margin-top: 10px;
      display: flex;
      gap: 12px;
    }
    .cart{
      border: 1px solid black;
      width: 100px;
      height: 80px;
      text-align: center;
      position: relative;
    }
    .cart:before {
      content: "";
      width: 30px;
      height: 30px;
      left: 0px;
      border: 1px solid black;
      display: block;
      border-radius: 50%;
      position: absolute;
      bottom: -15px;
      background-color: white;
    }
    .cart:after {
      background-color: white;
      content: "";
      width: 30px;
      height: 30px;
      border: 1px solid black;
      display: block;
      border-radius: 50%;
      bottom: -15px;
      position: absolute;
      right: 0px;
    }
  </style>
</head>
<body>
  <input type="text" id="person">
  <button id="add-person">add person</button>
  <button id="pop-person">get rid of person</button>

  <div id="train">
    <div class="cart">august</div>
    <div class="cart">gideon</div>
    <div class="cart">faiz</div>
  </div>

<script>
  let people = ["august", "gideon", "faiz"]
  let apb = document.getElementById("add-person")
  apb.addEventListener("click",function(){
    let personInput = document.getElementById("person")
    people.push(personInput.value)
    console.log(people)
    personInput.value = ""
  })
    let ppb = document.getElementById("pop-person")
    ppb.addEventListener("click",function(){
    let personInput = document.getElementById("person")
    people.pop()
    console.log(people)
  })

    
</script>
</body>
</html>
