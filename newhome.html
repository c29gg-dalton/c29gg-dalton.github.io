<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style type="text/css">
    #header{
height: 10%;
width: 100%;
}
.pages{
  display: inline-block;
  width: 33%;
  height: 8%;
  text-align: center;
  font-size: 5vw;
  color: black;
}
#home:hover{

background-color: turquoise ;
font-size: 6vw;
border-radius: 10%;
  transition-duration: 1s;

}
#journal:hover{

background-color: turquoise ;
font-size: 6vw;
border-radius: 10%;
  transition-duration: 1s;

}
#projects:hover{

background-color: turquoise ;
font-size: 6vw;
border-radius: 10%;
  transition-duration: 1s;

}
#oldHome{
  display: block;
  margin: auto;
  text-align: center;
}
#locationButtons{
  text-align: center;
}
button{
  font-size: 20px;
  margin: 5px;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
  <div id="header">
  <a class="pages" id="home" href="newhome.html">Home</a>
  <a class="pages" id="journal" href="journal.html">Journal</a>
  <a class="pages" id="projects" href="projects.html">Projects</a>
  <p></p>
  <a class="pages" id="oldHome" href="Index.html">Old Home</a>

  <div id="locationButtons">
    <button onclick="place = 'New York'">New York</button>
    <button onclick="place = 'London'">London</button>
    <button onclick="place = 'Tokyo'">Tokyo</button>
  </div>
</div>
 <script>


 function setup() {
  createCanvas(windowWidth, windowHeight);
  ellipseMode(CENTER)
  textAlign(CENTER)
  frameRate(60)
  angleMode(DEGREES)
  imageMode(CENTER)
}
let place = 'New York'
let NYskyline;
let Lskyline;
let Tskyline;
c='rgba(0,0,152,0.85)'

function preload(){
  NYskyline = loadImage("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrmt1Br3h9mnsVbOz-WkWiV2bw-sg1NYORFA&s")
  Lskyline = loadImage("https://skylinecity.store/cdn/shop/articles/skyline-london.jpg?v=1761921061")
  Tskyline = loadImage("https://i0.wp.com/www.touristjapan.com/wp-content/uploads/2025/09/tokyo-skyline-japan-views.jpg?fit=1800%2C1200&ssl=1")
}

function draw() {
  
  m = minute()
  s = second()

  
  
  strokeWeight(1)
  background(255);
  textSize(30)
    // if (keyCode === RIGHT_ARROW) {
    // }
  if(place == 'New York'){
    h = hour()
  image(NYskyline, windowWidth/2, windowHeight/2, windowWidth, windowHeight)

  }

  if(place == 'London'){
    h = hour()+5
    image(Lskyline, windowWidth/2, windowHeight/2, windowWidth, windowHeight)
  }

  if(place == 'Tokyo'){
    h = hour()+13
    image(Tskyline, windowWidth/2, windowHeight/2, windowWidth, windowHeight)
  }
  
  fill(c)
  ellipse(windowWidth/2, windowHeight/2,300,300)
  stroke(0)
  fill(0)
  ellipse(windowWidth/2, windowHeight/2,10,10)
  stroke('silver')
  fill('silver')
  text('1',windowWidth/2+55,windowHeight/2-82.5)
  text('2',windowWidth/2+92.5,windowHeight/2-52.5)
  text('3',windowWidth/2+115,windowHeight/2)
  text('4',windowWidth/2+92.5,windowHeight/2+60)
  text('5',windowWidth/2+55,windowHeight/2+105)
  text('6',windowWidth/2,windowHeight/2+125)
  text('7',windowWidth/2-60,windowHeight/2+105)
  text('8',windowWidth/2-105,windowHeight/2+60)
  text('9',windowWidth/2-115,windowHeight/2)
  text('10',windowWidth/2-95,windowHeight/2-52.5)
  text('11',windowWidth/2-55,windowHeight/2-84)
  text('12',windowWidth/2,windowHeight/2-105)

  fill(0)
  noStroke()
  text(place, windowWidth/2, windowHeight/2 + 230)

  translate(width/2, height/2);
  
  stroke(0)
  fill(0)
  
  x = cos((h-3)*30)*75
  y = sin((h-3)*30)*75
  xm = cos((m-15)*6)*100
  ym = sin((m-15)*6)*100
  xs = cos((s-15)*6)*100
  ys = sin((s-15)*6)*100

  strokeWeight(2)
  line(0,0,xs,ys)
  
  strokeWeight(7)
  line(0,0,x,y)
  
  strokeWeight(5)
  line(0,0,xm,ym)

  if (keyIsDown(67) === true) {
    c='rgba(50,50,255,0.85)'
  } else {
    c='rgba(0,0,152,0.85)'
  }
  noFill()

  stroke(220)
  strokeWeight(8)
  arc(0, 0, 340, 340, -90, 270)
  arc(0, 0, 365, 365, -90, 270)
  arc(0, 0, 390, 390, -90, 270)

  stroke(0)
  arc(0, 0, 340, 340, -90, -90 + ((h % 12) + minute()/60) * 30)

  stroke('yellow')
  arc(0, 0, 365, 365, -90, -90 + (minute() + second()/60) * 6)

  stroke('red')
  arc(0, 0, 390, 390, -90, -90 + second() * 6)
stroke(c)
}

function keyPressed() {
if (keyCode === RIGHT_ARROW) {
      if(place == 'New York'){
        place = 'London'
      }else if(place == 'London'){
        place = 'Tokyo'
      }else if(place == 'Tokyo'){
        place = 'New York'
      }
    }else if (keyCode === LEFT_ARROW) {
      if(place == 'New York'){
        place = 'Tokyo'
      }else if(place == 'Tokyo'){
        place = 'London'
      }else if(place == 'London'){
        place = 'New York'
      }
    }
}
 </script>

</body>
</html>
