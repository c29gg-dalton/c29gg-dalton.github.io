<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
 <script>
 	function setup() {
 	  createCanvas(windowWidth, windowHeight);
 	  rectMode(CENTER)
 	  angleMode(DEGREES);
 	}
		d=0
 	function draw() {
 		y=0
		x=0
 		for(i=0;i<100000;i++){
 		
 			d=dist(x*50,y*50,mouseX,mouseY)
 			let circleColor = map(d,0,200, 0, 255)
 			fill(circleColor)
 			
 			stroke(0+i/6)
 			circle(x*50,y*50,100)
 			x++
 			if(i%100===0){
 				y++
 				x=0
 			}
 		}
 		// for(i=0;i<100;i++){
		// 	for(j=0;j<100;j++){
		// 		fill(0+j*50)
 		// 	stroke(255-j*50)
		// 		circle(i*200,j*200,100)
		// 	}

 		// }
 	}

 </script>
</body>
</html>
