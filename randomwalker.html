<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
 <script>
 	function setup() {
 	  createCanvas(windowWidth, windowHeight);
 	  rectMode(CENTER)
 	  angleMode(DEGREES);
 	  frameRate(60)
 	  x=windowWidth/2
y=windowHeight/2

 	}
sx=5
sy=5

 	function draw() {
 		x+=random(-8,8)
 		y+=random(-8,8)
 		sx+=random(-1,1)
 		sy+=random(-1,1)

		fill(random(50,255),random(50,255),random(50,255))
 		rect(x,y,5,5)
 		}
 </script>
</body>
</html>
