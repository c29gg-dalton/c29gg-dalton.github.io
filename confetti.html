<!DOCTYPE html>
<html>
<head>
	<style>
		.confetti{
			animation-name: swing;
			animation-duration: 1s;
			animation-iteration-count: infinite;
			animation-timing-function: ease-in-out;
			animation-direction: alternate;
			animation-timing-function: linear;

		}
		@keyframes swing{
			from{
				transform: rotate(180deg) rotateY(90deg);
			}
			to{
				transform: rotate(-180deg) rotateY(-90deg);
			}
		}
		#btn{
			top:calc(50% - 50px);
			left: calc(50% - 50px);
			width: 100px;
			height: 100px;
			position: absolute;
			background-color: red;
			border-radius: 50%;
		}
	</style>
</head>
<body>
	<button id="btn">drop confetti</button>
	<input type="range" id="slider" name="number" min="0" max="100" value="1-">
	<script>

let start=1
let d=0
let n=5
let button= document.getElementById("btn")
let slider = document.getElementById("slider")
		function conf() {
		let s = document.createElement("div")
		let l= Math.random()*100
		let t= Math.random()*1
		let r= Math.random()*255
		let g= Math.random()*255
		let b= Math.random()*255
		let rotato= Math.random()*360
		let startRot = Math.random() * -365 + "deg"
		let endRot = Math.random() * 365 + "deg"
		let yeRot = Math.random() * -180 + "deg"
		let ysRot = Math.random() * 180 + "deg"
			s.style.width=30 +"px"
			s.style.height=10 +"px"
			s.style.left=l+"%"
			s.style.top=t+"%"
			s.style.backgroundColor="rgb("+r+","+g+","+b+")"
			s.style.position="absolute"
			s.style.transform= "rotate("+rotato+"deg)"
			document.body.appendChild(s)
			s.classList.add("confetti")
			s.style.setProperty("--startRot", startRot)
			s.style.setProperty("--endRot", endRot)
		function fall(){
			let ff = 1
			s.style.top = parseInt(s.style.top) + ff + "px"
		}
		setInterval(fall,20)

		}
		button.addEventListener("click",function(){
		// 	for(let i = 0; i<slider.value; i++) {
		// 		conf()
		// 	}
			setInterval(conf,5)
		}
		)
		

	</script>
</body>
</html>
