<html>
<head>

	<title></title>
<style>
	#button{
		width: 100px;

		left: 50px;

		background-color: skyblue;
		text-align: center;

</style>

<button id="button">click me!</button>

	console.log(btn)
	btn.addEventListener("click",function(){
		
	})

console.log("hovering")
let x= Math.random()*100
		let y= Math.random()*100

console.log("out")
	})
