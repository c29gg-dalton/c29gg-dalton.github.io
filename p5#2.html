<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
 <script>
 	function setup() {
 	  createCanvas(windowWidth, windowHeight);
 	  rectMode(CENTER)
 	  angleMode(DEGREES);
 	}

 	function draw() {
 		for(i=0,i<10,i++){
 			circle(i*50,0,100)
 		}
 	}

 </script>
</body>
</html>
