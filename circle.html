<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>p5.js Sketch with Back Button</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #backButton {

        position: fixed;
        top: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        background-color: red;
        border-radius: 50%;
        color: white;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
		justify-content: center;
		align-items: center;
		display: flex;
      }

      #backButton:hover {
        background-color: darkred;
      }
    </style>
  </head>
  <body>
<a id="backButton" href="projects.html">Back</a>

    <script>
      function setup() {
  createCanvas(windowWidth, windowHeight);
   colorMode(HSB);
}
x=0
y=0
function draw() {
  background(220);
  ellipse(x,y,x,y)
  x=mouseX
  y=mouseY
  fill(x,y,90)
}
    </script>
  </body>
</html>
